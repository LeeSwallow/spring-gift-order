spring.application.name=spring-gift

# h2 console
spring.h2.console.enabled=true

# Database configuration
spring.datasource.url=jdbc:h2:mem:test;MODE=MYSQL;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# init sql
spring.sql.init.mode=embedded
spring.sql.init.data-locations=classpath:sql/init-db.sql,classpath:sql/testing-dataset.sql

# JPA configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# error handling
server.error.path=/error

# jwt
gift.jwt.secret=b12277e4d918a0d95f2f5adc476cd3bff18911eb3d8f34fb5067f78326c5c6f0
gift.jwt.expiration=86400
gift.jwt.issuer=spring-gift

# OAuth2 configuration
spring.config.import=classpath:application-secret.properties
gift.oauth.redirect-uri=http://localhost:8080/api/auth/oauth2
gift.oauth.provider.kakao.baseurl=https://kauth.kakao.com

# service
gift.service.kakao.message.url=https://kapi.kakao.com/v2/api/talk/memo/send