<!-- 전체 페이지 레이아웃 -->
<!DOCTYPE html>
<html th:replace="~{layout/base :: admin_layout('상품 상세', '상품 상세', ~{::view_product_content}, ~{}, ~{::scripts})}"
     lang="ko" xmlns:th="http://www.w3.org/1999/html">
    <div th:fragment="view_product_content">
        <div class="max-w-4xl mx-auto">
            <div class="bg-white rounded-lg shadow-lg p-8">
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                    <!-- 상품 정보 -->
                    <div class="space-y-6">
                        <!-- 상품 ID -->
                        <div class="border-b border-gray-200 pb-4">
                            <div class="flex justify-between items-center">
                                <label class="text-sm font-medium text-gray-700">상품 ID</label>
                            </div>
                            <p id="prod-id" class="text-2xl font-bold text-gray-900 mt-1" th:text="${product.id}">1</p>
                        </div>

                        <!-- 상품명 -->
                        <div class="border-b border-gray-200 pb-4">
                            <div class="flex justify-between items-center">
                                <label class="text-sm font-medium text-gray-700">상품명</label>
                                <button
                                        class="text-blue-600 hover:text-blue-800 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-blue-300 rounded px-2 py-1 transition-colors"
                                        onclick="enableEdit('prod-name')"
                                >
                                    수정
                                </button>
                            </div>
                            <div id="prod-name" class="mt-1">
                                <p class="text-2xl font-bold text-gray-900" th:text="${product.name}">상품명</p>
                                <input
                                        type="hidden"
                                        id="prod-name-input"
                                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                        th:value="${product.name}"
                                />
                            </div>
                        </div>

                        <!-- 가격 -->
                        <div class="border-b border-gray-200 pb-4">
                            <div class="flex justify-between items-center">
                                <label class="text-sm font-medium text-gray-700">가격</label>
                                <button
                                        class="text-blue-600 hover:text-blue-800 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-blue-300 rounded px-2 py-1 transition-colors"
                                        onclick="enableEdit('prod-price')"
                                >
                                    수정
                                </button>
                            </div>
                            <div id="prod-price" class="mt-1">
                                <p class="text-2xl font-bold text-blue-600" th:text="${#numbers.formatInteger(product.price, 1,'COMMA')} + '원'">가격</p>
                                <input
                                        type="hidden"
                                        id="prod-price-input"
                                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                        th:value="${product.price}"
                                />
                            </div>
                        </div>

                        <!-- 소유자 ID -->
                        <div class="border-b border-gray-200 pb-4">
                            <div class="flex justify-between items-center">
                                <label class="text-sm font-medium text-gray-700">소유자 ID</label>
                            </div>
                            <div id="prod-owner" class="mt-1">
                                <p class="text-2xl font-bold text-gray-900" th:text="${product.owner.id}">소유자 ID</p>
                            </div>
                        </div>

                        <!-- 이미지 URL -->
                        <div class="border-b border-gray-200 pb-4">
                            <div class="flex justify-between items-center">
                                <label class="text-sm font-medium text-gray-700">이미지 URL</label>
                                <button
                                        class="text-blue-600 hover:text-blue-800 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-blue-300 rounded px-2 py-1 transition-colors"
                                        onclick="enableEdit('prod-url')"
                                >
                                    수정
                                </button>
                            </div>
                            <div id="prod-url" class="mt-1">
                                <p class="text-sm text-gray-900 overflow-hidden" th:text="${product.imageUrl}">이미지 URL</p>
                                <input
                                        type="hidden"
                                        id="prod-url-input"
                                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                        th:value="${product.imageUrl}"
                                />
                            </div>
                        </div>
                    </div>
                    <!-- 상품 이미지 뷰 -->
                    <div class="flex items-center justify-center">
                        <div class="text-center">
                            <div class="w-64 h-64 bg-gray-100 rounded-lg flex items-center justify-center mb-4">
                                <img th:src="${product.imageUrl}" alt="상품 이미지" class="w-full h-full object-cover rounded-lg"/>
                            </div>
                            <p class="text-sm text-gray-500" th:if="${product.imageUrl == null}">이미지 미등록</p>
                        </div>
                    </div>
                </div>

                <!-- 상품 옵션 -->
                <div class="mt-4">
                    <h2 class="my-4 text-xl font-extrabold">상품 옵션</h2>
                    <!-- 옵션 목록 표시 -->
                    <div class="bg-gray-10 border-gray-200 rounded-lg mb-4 overflow-y-auto min-h-60 max-h-60 ">
                        <table class="w-full rounded-lg border">
                            <thead class="bg-gray-100">
                            <tr class="py-1 h-10 text-center text-sm font-medium text-gray-600">
                                <th class="px-2 border w-[15%]">옵션 ID</th>
                                <th class="px-2 border w-[50%]">옵션 이름</th>
                                <th class="px-2 border w-[15%]">수량</th>
                                <th class="px-2 border w-[20%]">액션</th>
                            </tr>
                            </thead>
                            <tbody id="prod-option-list" class="bg-white">
                                <tr th:each="option : ${product.options}" class="py-1 h-10 text-center text-sm font-medium text-gray-600">
                                    <td class="px-2 border text-right" th:text="${option.id}"></td>
                                    <td class="px-2 border text-left" th:text="${option.name}"></td>
                                    <td class="px-2 border text-right" th:text="${option.quantity}"></td>
                                    <td class="px-2 border">
                                        <button type="button" onClick="activateUpdate(this)"
                                                class="text-blue-600 hover:text-blue-800 focus:outline-none text-center mx-2">
                                            수정
                                        </button>
                                        <button type="button" onClick="removeOption(this)"
                                                class="text-red-600 hover:text-red-800 focus:outline-none text-center mx-2">
                                            삭제
                                        </button>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <!-- 옵션 입력 필드 -->
                    <h3 class="font-bold text-lg my-3" id="change-option-title">옵션 추가</h3>
                    <div id="prod-option-input" class="option-item flex gap-2 items-center justify-between">
                        <input type="hidden" name="opt-id" value="0">
                        <input type="text" name="opt-name" placeholder="옵션 이름"
                               class="w-[50%] px-3 py-2 border text-left border-gray-300 rounded-lg" required />
                        <input type="number" name="opt-quantity" placeholder="수량"
                               class="w-[30%] px-3 py-2 border text-right border-gray-300 rounded-lg" min="0" required />
                        <button type="button" onclick="addOption()" id="add-option-btn"
                                class="px-3 py-2 bg-green-100 border border-green-300 rounded text-sm hover:bg-green-200">
                            + 추가 완료
                        </button>
                        <button type="button" onclick="updateOption(    )" id="update-option-btn" hidden
                                class="px-3 py-2 bg-blue-100 border border-blue-300 rounded text-sm hover:bg-blue-200">
                            v 수정 완료
                        </button>
                    </div>
                </div>

                <!-- 버튼 영역 -->
                <div class="flex justify-center space-x-4 mt-8 pt-6 border-t border-gray-200">
                    <a href="/admin/products"
                       class="px-4 py-2 border border-gray-300 rounded-lg text-sm font-medium text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors">
                        목록으로
                    </a>
                    <button
                            id="btn-edit"
                            class="px-4 py-2 bg-blue-600 border border-transparent rounded-lg text-sm font-medium text-white hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors"
                            onclick="requestEditProduct()"
                            hidden
                    >
                        수정 완료
                    </button>
                </div>
            </div>
        </div>
    </div>
    <th:block th:fragment="scripts">
        <script th:src="@{/js/admin/index.js}"></script>
        <script th:src="@{/js/admin/product-edit.js}"></script>
    </th:block>
</html>
